    <script>
        function showPage(pageId) {
            // Hide all pages
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));

            // Remove active class from nav items
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));

            // Show selected page
            document.getElementById(pageId).classList.add('active');

            // Add active class to corresponding nav item
            if (pageId !== 'edit') {
                const navItem = Array.from(navItems).find(item =>
                    item.textContent.toLowerCase().includes(pageId.toLowerCase())
                );
                if (navItem) {
                    navItem.classList.add('active');
                }
            }
        }

        function toggleHeart(card) {
            const heart = card.querySelector('.heart-icon');
            heart.classList.toggle('liked');
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function () {
            showPage('discover');

            // Set up search functionality
            const searchInput = document.querySelector('.search-input');
            searchInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    console.log('Searching for:', this.value);
                    // Add search functionality here
                }
            });

            // Set up style recommendation
            const recommendButton = document.querySelector('.style-recommendation');
            recommendButton.addEventListener('click', function () {
                const mood = searchInput.value;
                if (mood) {
                    alert(`"${mood}"에 맞는 스타일을 추천해드릴게요!`);
                } else {
                    alert('기분이나 일정을 먼저 입력해주세요.');
                }
            });
        });
    </script>
